name: Nobar release

# Signed APK of the nobar fork, published to GitHub Releases on every push to `master`
# Two releases per build:
#   - nobar-v<N>: a versioned release to keep and share
#   - pre-release: a moving tag the in-app updater watches (GithubReleases.APK_PRERELEASE);
#     the app updates when that tag's commit differs from the one it was built from.
on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: nobar-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 30 # release notes list recent commits

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Stable signing key → each new APK installs over the previous one (keeps history,
      # extensions and settings). app/build.gradle.kts picks the first file in
      # $RUNNER_TEMP/keystore when SIGNING_KEY_ALIAS is set.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          # No key, no release: a debug-signed APK couldn't be updated by the signed ones later.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No KEYSTORE_B64/KEYSTORE_PASS secrets: building only, nothing is published."
            echo "PUBLISH=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/nobar.jks"
          PASS="$(printf %s "$KEYSTORE_PASS" | tr -d '\r\n')"
          if keytool -list -keystore "$RUNNER_TEMP/keystore/nobar.jks" -storepass "$PASS" >/dev/null 2>&1; then
            echo "::add-mask::$PASS"
            {
              echo "SIGNING_KEY_ALIAS=${KEYSTORE_ALIAS:-key0}"
              echo "SIGNING_KEY_PASSWORD=$PASS"
              echo "SIGNING_STORE_PASSWORD=$PASS"
              echo "SIGNING_NOTE="
              echo "PUBLISH=true"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_PASS does not open KEYSTORE_B64: building only, nothing is published. Re-set both secrets."
            rm -rf "$RUNNER_TEMP/keystore"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          fi

      # Without the release key, build the debug variant (release would be unsigned).
      - name: Build APK
        run: |
          if [ -n "$SIGNING_KEY_ALIAS" ]; then
            ./gradlew assemblePrereleaseRelease
            echo "APK_DIR=app/build/outputs/apk/prerelease/release" >> "$GITHUB_ENV"
          else
            ./gradlew assemblePrereleaseDebug
            echo "APK_DIR=app/build/outputs/apk/prerelease/debug" >> "$GITHUB_ENV"
          fi

      - name: Publish native libraries
        # Nobar: FFmpeg and the torrent engine are downloaded by the app on first use
        # (NativeLibs.kt) from the release natives-<hash>; make sure it holds this build's set.
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :app:exportNativeLibs
          d=app/build/natives; tag=$(cat $d/TAG)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease \
            --title "Native libraries ${tag#natives-}" \
            --notes "Downloaded by CloudStream Nobar on first use (FFmpeg decoders, torrent engine). Do not delete." || true
          have=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for f in $d/*.so; do echo "$have" | grep -qx "$(basename "$f")" || gh release upload "$tag" "$f" || true; done
          have=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for f in $d/*.so; do echo "$have" | grep -qx "$(basename "$f")" || { echo "::error::$(basename "$f") missing from $tag"; exit 1; }; done

      - name: Collect APK and notes
        run: |
          n=${{ github.run_number }}
          # One APK per architecture plus a universal one. The universal goes first: older in-app
          # updaters take the first APK of the release, newer ones pick their architecture.
          cp "$(ls "$APK_DIR"/*universal*.apk | head -1)" "cloudstream-nobar-$n-universal.apk"
          cp "$(ls "$APK_DIR"/*arm64-v8a*.apk | head -1)" "cloudstream-nobar-$n-arm64.apk"
          cp "$(ls "$APK_DIR"/*armeabi-v7a*.apk | head -1)" "cloudstream-nobar-$n-arm32.apk"
          echo "APKS=cloudstream-nobar-$n-universal.apk cloudstream-nobar-$n-arm64.apk cloudstream-nobar-$n-arm32.apk" >> "$GITHUB_ENV"
          ls -l cloudstream-nobar-$n-*.apk
          {
            echo "CloudStream Nobar build $n${SIGNING_NOTE} · \`${GITHUB_SHA::7}\`"
            echo
            echo "Pick one: **cloudstream-nobar-$n-arm64.apk** (almost every phone and TV box since ~2017),"
            echo "**cloudstream-nobar-$n-arm32.apk** (older 32-bit devices), or **-universal** if unsure."
            echo "It installs next to the official CloudStream"
            echo "(package \`com.lagradost.cloudstream3.nobar\`), and new builds install over the old one."
            echo "Everyone in a room needs the same extension installed."
            echo
            echo "### Changes"
            git log -15 --no-merges --format='- %s' -- . ':!.github'
          } > release-body.md

      - uses: softprops/action-gh-release@v2
        if: env.PUBLISH == 'true'
        with:
          tag_name: nobar-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: CloudStream Nobar ${{ github.run_number }}${{ env.SIGNING_NOTE }}
          prerelease: true
          body_path: release-body.md
          files: |
            cloudstream-nobar-${{ github.run_number }}-universal.apk
            cloudstream-nobar-${{ github.run_number }}-arm64.apk
            cloudstream-nobar-${{ github.run_number }}-arm32.apk

      # Move the "pre-release" tag (and its release) to this commit for the in-app updater.
      - name: Update in-app update channel
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pre-release --cleanup-tag --yes 2>/dev/null || true
          git push origin ":refs/tags/pre-release" 2>/dev/null || true
          gh release create pre-release $APKS --target "$GITHUB_SHA" --prerelease \
            --title "Pre-release (in-app updates)" --notes-file release-body.md
