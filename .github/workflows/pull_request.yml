name: Artifact Build

on: [pull_request]

permissions:
  contents: write  # publishes the natives-<hash> release (see "Publish native libraries")

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Ensure binary compatibility
      # This is to ensure that your code is backwards compatible.
      # If this fails you need to add a @Prerelease annotation to new code.
      # Fork: the upstream library.api dump is already out of date on master (library is
      # untouched here), so report it but don't block the APK build.
      continue-on-error: true
      run: ./gradlew library:checkKotlinAbi

    - name: Run Gradle
      # Fork: skip the ABI check here too (`check` depends on it); it's reported above.
      run: ./gradlew assemblePrereleaseDebug lint check -x library:checkKotlinAbi

    - name: Publish native libraries
      # Nobar: FFmpeg and the torrent engine are downloaded by the app on first use
      # (NativeLibs.kt) from the release natives-<hash>; make sure it holds this build's set.
      if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./gradlew --no-configuration-cache :app:exportNativeLibs
        d=app/build/natives; tag=$(cat $d/TAG)
        gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease \
          --title "Native libraries ${tag#natives-}" \
          --notes "Downloaded by CloudStream Nobar on first use (FFmpeg decoders, torrent engine). Do not delete." || true
        have=$(gh release view "$tag" --json assets --jq '.assets[].name')
        for f in $d/*.so; do echo "$have" | grep -qx "$(basename "$f")" || gh release upload "$tag" "$f" || true; done
        have=$(gh release view "$tag" --json assets --jq '.assets[].name')
        for f in $d/*.so; do echo "$have" | grep -qx "$(basename "$f")" || { echo "::error::$(basename "$f") missing from $tag"; exit 1; }; done

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-build
        path: "app/build/outputs/apk/prerelease/debug/*.apk"
